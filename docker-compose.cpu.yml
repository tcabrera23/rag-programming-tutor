version: '3.8'

# CPU only (sin GPU NVIDIA):
# docker-compose -f docker-compose.cpu.yml up --build
#
# El seed de RAG se carga solo la primera vez (volumen vacío).
# Para reseed: docker compose -f docker-compose.cpu.yml down -v

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: chatpdep_postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: chatpdep
      POSTGRES_PASSWORD: chatpdep
      POSTGRES_DB: chatpdep
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./db/seed.sql.gz:/docker-entrypoint-initdb.d/02-seed.sql.gz:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chatpdep -d chatpdep"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 40s
    restart: unless-stopped
    networks:
      - chatpdep_network

  chatpdep:
    build: .
    container_name: chatpdep_app
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data
      - .:/app
    environment:
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - DATABASE_URL=postgresql://chatpdep:chatpdep@postgres:5432/chatpdep
      - OLLAMA_BASE_URL=http://ollama:11434
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_started
    restart: unless-stopped
    networks:
      - chatpdep_network

  ollama:
    image: ollama/ollama:latest
    container_name: chatpdep_ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0
      - OLLAMA_NUM_PARALLEL=1
      - OLLAMA_MAX_LOADED_MODELS=1
    restart: unless-stopped
    networks:
      - chatpdep_network
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        /bin/ollama serve &
        sleep 5
        echo "=== Instalando phi4-mini (preguntas simples) ==="
        ollama pull phi4-mini
        echo "=== Instalando qwen3 4B (código y consultas complejas) ==="
        ollama pull qwen3:4b
        echo "=== Modelos instalados correctamente ==="
        ollama list
        echo "=== Sugerencia: también podés instalar ==="
        echo "    ollama pull deepseek-coder:6.7b"
        echo "    ollama pull qwen2.5-coder:7b"
        wait

networks:
  chatpdep_network:
    driver: bridge

volumes:
  chatpdep_data:
    driver: local
  ollama_models:
    driver: local
  pgdata:
    driver: local
