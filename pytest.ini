[pytest]
# Configuración de pytest para ChatPdeP

# Directorios de tests
testpaths = tests

# Opciones por defecto
addopts = 
    -v
    --tb=short
    --strict-markers
    -ra
    --color=yes

# Markers personalizados
markers =
    unit: Tests unitarios rápidos
    integration: Tests de integración (requieren API keys)
    slow: Tests lentos (involucran LLMs)
    judge: Tests con LLM-as-a-Judge
    database: Tests de base de datos
    rag: Tests de RAG/Supabase

# Configuración de output
console_output_style = progress

# Warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

# Coverage (si se usa pytest-cov)
[coverage:run]
source = app
omit = 
    tests/*
    venv/*
    */site-packages/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:

